<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>慈惠道場 · 堂慶邀請函</title>
<meta name="theme-color" content="#ECE8E3">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Noto+Serif+TC:wght@400;600;900&family=Yuji+Boku&family=LXGW+WenKai+TC:wght@400&display=swap">
<link rel="preload" as="image" href="art/bluebird.webp">
<link rel="stylesheet" href="style.css">
<script src="content.js"></script>
<script src="app.js" defer></script>
</head>
<body class="sealed">

<!-- host only: personal link maker (?host) -->
<section id="host" class="host" hidden>
  <h2 data-t="hostTitle"></h2>
  <p class="host-lead" data-t="hostLead"></p>
  <textarea id="host-names" rows="5"></textarea>
  <div class="host-row">
    <button type="button" id="host-make" data-t="hostMake"></button>
    <button type="button" id="host-copy-all" class="ghost" data-t="hostCopyAll"></button>
  </div>
  <ul id="host-links"></ul>
  <p class="host-note" data-t="hostNote"></p>
</section>

<!-- the sky: a bluebird, the Queen Mother's messenger, brings the letter -->
<div id="sky" class="sky" role="button" tabindex="0">
  <div class="sky-box">
    <div class="sky-art" aria-hidden="true"></div>
    <i class="rays" aria-hidden="true"></i>
    <i class="cloud c1" aria-hidden="true"></i><i class="cloud c2" aria-hidden="true"></i>
  </div>
  <p class="sky-title" aria-hidden="true"><span>慈惠道場</span><span>堂慶</span></p>

  <div class="courier" aria-hidden="true">
    <div class="bird"><i class="carried"></i></div>
  </div>

  <!-- the letter: once the bird lets go, it flies at you and fills the screen -->
  <div id="letter" class="letter">
    <div class="env-box" aria-hidden="true">
      <div class="env-inside"></div>
      <div class="flap fl-left"><i class="sheet"></i><i class="foil"></i></div>
      <div class="flap fl-right"><i class="sheet"></i><i class="foil"></i></div>
      <div class="flap fl-bottom"><i class="sheet"></i><i class="foil"></i></div>
      <div class="top-shadow"></div>
      <div class="flap-top">
        <i class="face front"><i class="sheet"></i><i class="foil"></i></i>
        <i class="face back"></i>
      </div>
      <svg class="seams" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L50 50 L100 0 M0 100 L50 50 L100 100"/></svg>
      <svg class="seams glowing" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 100 L50 50 L100 100 M0 0 L50 50 L100 0"/></svg>
      <div class="light"><i class="wave"></i><i class="warm"></i><i class="beams"></i><i class="core"></i></div>
    </div>
    <!-- the name, on a label pasted below the seal -->
    <div class="slip"><span id="letter-to" class="l-to"></span><span class="l-sealed" data-t="sealed"></span></div>
    <span class="seal" aria-hidden="true"><b>慈</b>
<b>惠</b></span>
  </div>

  <!-- a bluebird flies out of the light -->
  <div class="bird-out" aria-hidden="true"><div class="bird"></div></div>

  <p class="tap"><span data-t="tapToOpen"></span></p>
  <i class="burst" aria-hidden="true"></i>
</div>

<main id="main" class="page" tabindex="-1">

  <!-- the hanging scroll on the Jade Pool -->
  <section class="hero">
    <div class="hero-box" aria-hidden="true"><div class="hero-art"></div><i class="cloud c3"></i></div>
    <div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="scroll">
      <i class="rod rod-top" aria-hidden="true"></i>
      <div class="paper">
        <img class="plaque" src="art/plaque.webp" alt="慈惠道場">
        <h1 class="event">堂 慶</h1>
        <div class="vtext">
          <p id="scroll-guest" class="v-guest"></p>
          <p id="scroll-dates"></p>
          <p data-t="holding"></p>
          <p data-t="welcome"></p>
          <p class="v-sign" data-t="signature"></p>
        </div>
      </div>
      <i class="rod rod-bottom" aria-hidden="true"></i>
    </div>
    <a class="scroll-hint" href="#when" aria-label="往下看"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
  </section>

  <!-- when -->
  <section id="when" class="when">
    <div class="cloud-band" aria-hidden="true" data-reveal></div>
    <h2 class="title" data-t="datesTitle" data-reveal></h2>
    <ul id="dates" class="dates" data-reveal></ul>
    <p id="time-line" class="time-line" data-reveal></p>
  </section>

  <!-- countdown -->
  <section class="countdown">
    <h2 class="title" data-t="countdownTitle" data-reveal></h2>
    <div id="countdown-clock" class="clock" hidden data-reveal>
      <p><span id="cd-days">0</span><small data-t="days"></small></p>
      <p><span id="cd-hours">00</span><small data-t="hours"></small></p>
      <p><span id="cd-minutes">00</span><small data-t="minutes"></small></p>
      <p><span id="cd-seconds">00</span><small data-t="seconds"></small></p>
    </div>
    <p id="countdown-note" class="countdown-note" hidden data-reveal></p>
  </section>

  <!-- place -->
  <section class="place">
    <div class="cloud-band" aria-hidden="true" data-reveal></div>
    <h2 class="title" data-t="placeTitle" data-reveal></h2>
    <p id="venue-name" class="venue-name" data-reveal></p>
    <p id="venue-address" class="venue-address" data-reveal></p>
    <a id="map-link" class="btn" target="_blank" rel="noopener" data-t="map" hidden></a>
  </section>

  <!-- program -->
  <section class="program">
    <i class="peach-branch" aria-hidden="true"></i>
    <h2 class="title" data-t="programTitle" data-reveal></h2>
    <p id="program-note" class="program-note" data-reveal></p>
    <div id="program"></div>
  </section>

  <!-- the deities of the dojo -->
  <section class="deities-sec">
    <div class="cloud-band" aria-hidden="true" data-reveal></div>
    <h2 class="title" data-t="deitiesTitle" data-reveal></h2>
    <ul id="deities" class="deities"></ul>
  </section>

  <!-- footer -->
  <footer class="foot">
    <div class="lotus-pond" aria-hidden="true"></div>
    <p class="foot-sign" data-t="signature" data-reveal></p>
    <a id="site-link" class="btn ghost" target="_blank" rel="noopener" data-t="siteLink" data-reveal></a>
    <p id="credit" class="credit" data-t="credit"></p>
  </footer>
</main>

</body>
</html>
