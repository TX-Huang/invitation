<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Happy Birthday, Dodo</title>
<meta name="theme-color" content="#5A1828">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Pinyon+Script&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+TC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<script src="content.js"></script>
<script src="app.js" defer></script>
</head>
<body class="sealed">

<!-- the envelope: embossed burgundy paper, gold-foil roses, a wax seal -->
<div id="envelope" class="envelope" role="button" tabindex="0">
  <div class="env-box" aria-hidden="true">
    <div class="env-inside"><i class="glow"></i></div>
    <div class="flap fl-left"><i class="paper"></i><i class="foil"></i></div>
    <div class="flap fl-right"><i class="paper"></i><i class="foil"></i></div>
    <div class="flap fl-bottom"><i class="paper"></i><i class="foil"></i></div>
    <div class="top-shadow"></div>
    <div class="flap-top">
      <i class="face front"><i class="paper"></i><i class="foil"></i></i>
      <i class="face back"></i>
    </div>
    <svg class="seams" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L50 52 L100 0 M0 100 L50 48 L100 100"/></svg>
    <!-- the light from inside: glowing seams, a warm wash, beams, a bright core under the seal -->
    <svg class="seams-glow" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 100 L50 48 L100 100 M0 0 L50 52 L100 0"/></svg>
    <div class="light"><i class="warm"></i><i class="beams"></i><i class="core"></i></div>
    <div class="burst"></div>
  </div>
  <div id="seal" class="seal"><span class="mono">I<i>&amp;</i>D</span></div>
  <p class="tap"><span data-t="tapToOpen"></span></p>
</div>

<main id="main" class="page" tabindex="-1">

  <!-- the card -->
  <section class="card">
    <div class="card-box">
      <div class="card-art" aria-hidden="true"></div>
      <div class="card-text">
        <p class="wd" data-t="happyBirthday"></p>
        <h1 class="names"><span data-to></span></h1>
        <p id="card-date" class="card-date"></p>
        <a class="scroll-hint" href="#invite"><span data-t="scroll"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
      </div>
    </div>
  </section>

  <!-- the invitation -->
  <section id="invite" class="invite">
    <div class="swans" aria-hidden="true" data-reveal></div>
    <p class="script-title" data-t="inviteTitle" data-reveal></p>
    <p class="invite-line" data-t="inviteLine" data-reveal></p>
  </section>

  <!-- countdown -->
  <section class="countdown torn">
    <h2 class="title" data-t="countdownTitle" data-reveal></h2>
    <div id="countdown-clock" class="clock" hidden data-reveal>
      <p><span id="cd-days">0</span><small data-t="days"></small></p><b aria-hidden="true">:</b>
      <p><span id="cd-hours">00</span><small data-t="hours"></small></p><b aria-hidden="true">:</b>
      <p><span id="cd-minutes">00</span><small data-t="minutes"></small></p><b aria-hidden="true">:</b>
      <p><span id="cd-seconds">00</span><small data-t="seconds"></small></p>
    </div>
    <p id="countdown-note" class="countdown-note" hidden data-reveal></p>
  </section>

  <!-- the place -->
  <section class="location torn">
    <h2 class="title" data-t="placeTitle" data-reveal></h2>
    <p id="venue-name" class="venue-name" data-reveal></p>
    <p id="venue-area" class="venue-area" data-reveal></p>
    <p id="venue-when" class="venue-when" data-reveal></p>
    <p id="venue-address" class="venue-address" data-reveal></p>
    <div class="venue-art" aria-hidden="true" data-reveal></div>
    <a id="map-link" class="map-btn" target="_blank" rel="noopener" data-t="map"></a>
  </section>

  <!-- a letter from the heart -->
  <section class="letter torn">
    <h2 class="title" data-t="letterTitle" data-reveal></h2>
    <div class="letter-paper" data-reveal>
      <p class="letter-to">Dear <span data-to></span>,</p>
      <div id="letter-text" class="letter-text"></div>
      <p id="letter-from" class="letter-from"></p>
    </div>
  </section>

  <!-- footer -->
  <footer class="foot torn">
    <i class="corner left" aria-hidden="true"></i><i class="corner right" aria-hidden="true"></i>
    <p class="script-title" data-reveal>Happy Birthday</p>
    <p class="foot-line" data-t="footer" data-reveal></p>
  </footer>
</main>

</body>
</html>
