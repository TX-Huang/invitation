<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Isaac &amp; Dodo · Wedding</title>
<meta name="theme-color" content="#EFEAF2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,400;0,500;0,600;1,400;1,500;1,600&family=Pinyon+Script&family=LXGW+WenKai+TC:wght@400;700&family=Noto+Serif+TC:wght@400;500;700&display=swap">
<link rel="stylesheet" href="style.css">
<script src="content.js"></script>
<script src="app.js" defer></script>
</head>
<body class="sealed">

<!-- host only: personal link maker (?host) -->
<section id="host" class="host" hidden>
  <h2 data-t="hostTitle"></h2>
  <p class="host-lead" data-t="hostLead"></p>
  <textarea id="host-names" rows="5"></textarea>
  <div class="host-row">
    <button type="button" id="host-make" data-t="hostMake"></button>
    <button type="button" id="host-copy-all" class="ghost" data-t="hostCopyAll"></button>
  </div>
  <ul id="host-links"></ul>
  <p class="host-note" data-t="hostNote"></p>
</section>

<!-- language + music -->
<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="zh" aria-pressed="true">中</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
<button type="button" id="music" class="music" hidden aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
  <span class="sr" data-t="music"></span>
</button>
<audio id="audio" loop preload="none"></audio>

<!-- the envelope -->
<div id="envelope" class="envelope" role="button" tabindex="0">
  <div class="env-stage" aria-hidden="true">
    <!-- inside of the envelope, and the card waiting in it -->
    <div class="env-pocket"></div>
    <div class="env-card frame-art"></div>
    <!-- front flaps: sides first, bottom over them -->
    <div class="env-front">
      <div class="fw fw-left"><i class="flap flap-left"></i></div>
      <div class="fw fw-right"><i class="flap flap-right"></i></div>
      <div class="fw fw-bottom"><i class="flap flap-bottom"></i>
        <svg class="edge" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 100 L50 41 L100 100"/></svg>
      </div>
    </div>
    <!-- top flap: its shadow, then the flap itself (folds up in 3D) -->
    <div class="top-shadow"><i></i></div>
    <div class="flap-top">
      <i class="face front"><i class="flap-blossom"></i><i class="flap-birds"></i><svg class="edge" viewBox="0 0 100 100" preserveAspectRatio="none"><path d="M0 0 L50 44 L100 0"/></svg></i>
      <i class="face back"></i>
    </div>
  </div>

  <!-- the ribbon: two halves that slide apart, and the bow on top -->
  <div class="ribbon-wrap" aria-hidden="true">
    <div class="ribbon"><i class="r-half r-top"></i><i class="r-half r-bottom"></i></div>
  </div>
  <div class="bow-wrap" aria-hidden="true">
    <div class="bow-art"></div>
    <svg class="bow-svg" viewBox="0 0 240 170">
      <defs>
        <linearGradient id="satinA" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset=".45" stop-color="#F7F3F9"/><stop offset=".8" stop-color="#E6DEEA"/><stop offset="1" stop-color="#D5CBDB"/>
        </linearGradient>
        <linearGradient id="satinB" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FDFBFE"/><stop offset=".6" stop-color="#EEE8F1"/><stop offset="1" stop-color="#D9CFDF"/>
        </linearGradient>
        <radialGradient id="loopShade" cx=".72" cy=".55" r=".75">
          <stop offset="0" stop-color="#A99DB6" stop-opacity=".85"/><stop offset=".55" stop-color="#CFC5D8" stop-opacity=".5"/><stop offset="1" stop-color="#EDE8F1" stop-opacity="0"/>
        </radialGradient>
        <linearGradient id="knotG" x1="0" y1="0" x2="1" y2="1">
          <stop offset="0" stop-color="#FFFFFF"/><stop offset=".55" stop-color="#ECE5EF"/><stop offset="1" stop-color="#CBBFD3"/>
        </linearGradient>
        <filter id="fabric" x="-6%" y="-6%" width="112%" height="112%">
          <feTurbulence type="fractalNoise" baseFrequency="0.04 0.7" numOctaves="2" seed="4" result="t"/>
          <feDisplacementMap in="SourceGraphic" in2="t" scale="2.4" xChannelSelector="R" yChannelSelector="G" result="d"/>
          <feTurbulence type="fractalNoise" baseFrequency="1.5 0.1" numOctaves="1" seed="9" result="w"/>
          <feColorMatrix in="w" type="matrix" values="0 0 0 0 .42  0 0 0 0 .38  0 0 0 0 .48  0 0 0 .14 0" result="wt"/>
          <feComposite in="wt" in2="d" operator="in" result="wm"/>
          <feMerge><feMergeNode in="d"/><feMergeNode in="wm"/></feMerge>
        </filter>
      </defs>
      <g filter="url(#fabric)">
        <path class="bow-tail" d="M110 78 C100 98 84 120 64 150 L80 147 L86 162 C100 132 114 106 122 82 Z" fill="url(#satinB)"/>
        <path class="bow-tail" d="M130 78 C140 100 152 124 168 156 L152 152 L148 166 C136 136 124 108 118 82 Z" fill="url(#satinB)"/>
        <g class="bow-loop">
          <path d="M114 62 C98 40 66 22 42 30 C22 37 16 60 28 78 C40 96 80 92 114 80 Z" fill="url(#satinA)"/>
          <path d="M110 66 C96 52 70 44 54 50 C44 55 46 68 58 74 C74 82 96 78 110 74 Z" fill="url(#loopShade)"/>
          <path d="M106 62 C88 44 60 34 40 42" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
          <path d="M30 76 C48 90 84 88 110 78" fill="none" stroke="#C9BED1" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        </g>
        <g class="bow-loop" transform="matrix(-1 0 0 1 240 0)">
          <path d="M114 62 C98 40 66 22 42 30 C22 37 16 60 28 78 C40 96 80 92 114 80 Z" fill="url(#satinA)"/>
          <path d="M110 66 C96 52 70 44 54 50 C44 55 46 68 58 74 C74 82 96 78 110 74 Z" fill="url(#loopShade)"/>
          <path d="M106 62 C88 44 60 34 40 42" fill="none" stroke="#FFFFFF" stroke-width="2.2" stroke-linecap="round" opacity=".8"/>
          <path d="M30 76 C48 90 84 88 110 78" fill="none" stroke="#C9BED1" stroke-width="1.4" stroke-linecap="round" opacity=".7"/>
        </g>
        <path d="M106 58 C112 52 128 52 134 58 C139 66 138 80 132 86 C124 91 114 90 108 85 C102 78 101 66 106 58 Z" fill="url(#knotG)"/>
        <path d="M112 60 C116 70 115 80 111 86 M126 58 C128 68 128 78 124 88" fill="none" stroke="#C4B8CC" stroke-width="1.2" stroke-linecap="round" opacity=".75"/>
      </g>
    </svg>
  </div>

  <p class="tap"><span data-t="tapToOpen"></span></p>
</div>

<main id="main" class="page" tabindex="-1">

  <!-- hero -->
  <section class="hero">
    <div class="hero-frame frame-art" aria-hidden="true"></div>
    <div class="petals" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
    <div class="hero-body">
      <p id="hero-eyebrow" class="smallcaps" data-t="eyebrow" data-reveal></p>
      <h1 class="names" data-reveal><span>Isaac</span><span class="amp">&amp;</span><span>Dodo</span></h1>
      <p id="greeting" class="greeting" data-reveal></p>
      <div class="sprig" aria-hidden="true" data-reveal></div>
      <div id="hero-date" class="hero-date" data-reveal></div>
      <div class="hero-venue" data-reveal>
        <p class="smallcaps" data-t="venueLabel"></p>
        <p id="hero-venue" class="venue-name"></p>
      </div>
    </div>
    <a class="scroll-hint" href="#countdown"><span class="sr" data-t="scroll"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
  </section>

  <!-- countdown -->
  <section id="countdown" class="countdown">
    <h2 class="title" data-t="countdownTitle" data-reveal></h2>
    <p id="countdown-sub" class="subtitle" data-reveal></p>
    <div class="tile-frame" data-reveal>
      <i class="bloom b1" aria-hidden="true"></i><i class="bloom b2" aria-hidden="true"></i><i class="bloom b3" aria-hidden="true"></i><i class="bloom b4" aria-hidden="true"></i>
      <div class="tile-inner">
        <div id="countdown-clock" class="clock" hidden>
          <p class="big"><span id="cd-days">0</span><small data-t="days"></small></p>
          <div class="small-row">
            <p><span id="cd-hours">0</span><small data-t="hours"></small></p>
            <p><span id="cd-minutes">0</span><small data-t="minutes"></small></p>
            <p><span id="cd-seconds">0</span><small data-t="seconds"></small></p>
          </div>
        </div>
        <p id="countdown-note" class="countdown-note" hidden></p>
      </div>
    </div>
  </section>

  <!-- story -->
  <section class="story">
    <div class="clouds paint" aria-hidden="true" data-reveal></div>
    <h2 class="title" data-t="storyTitle" data-reveal></h2>
    <div id="story-text" class="story-text" data-reveal></div>
    <p class="signature" data-reveal>Isaac &amp; Dodo</p>
    <div class="birds-fly" aria-hidden="true" data-reveal></div>
  </section>

  <!-- celebration -->
  <section class="celebration">
    <div class="garden paint" aria-hidden="true" data-reveal></div>
    <h2 class="title" data-t="celebrationTitle" data-reveal></h2>
    <p class="smallcaps light" data-t="celebrationSub" data-reveal></p>
    <div class="ornate" data-reveal>
      <svg class="corner tl" viewBox="0 0 60 60" aria-hidden="true"><path d="M2 58V14Q2 2 14 2h44M10 50V20q0-10 10-10h30M14 30q8-2 10-10M24 14q-2 8-10 10"/></svg>
      <svg class="corner tr" viewBox="0 0 60 60" aria-hidden="true"><path d="M2 58V14Q2 2 14 2h44M10 50V20q0-10 10-10h30M14 30q8-2 10-10M24 14q-2 8-10 10"/></svg>
      <svg class="corner bl" viewBox="0 0 60 60" aria-hidden="true"><path d="M2 58V14Q2 2 14 2h44M10 50V20q0-10 10-10h30M14 30q8-2 10-10M24 14q-2 8-10 10"/></svg>
      <svg class="corner br" viewBox="0 0 60 60" aria-hidden="true"><path d="M2 58V14Q2 2 14 2h44M10 50V20q0-10 10-10h30M14 30q8-2 10-10M24 14q-2 8-10 10"/></svg>
      <p id="cele-venue" class="cele-venue"></p>
      <p id="cele-address" class="cele-address"></p>
      <p id="cele-when" class="cele-when"></p>
      <a id="map-link" class="map-btn" target="_blank" rel="noopener" data-t="map" hidden></a>
    </div>
  </section>

  <!-- the day -->
  <section class="day">
    <div class="day-strip" aria-hidden="true" data-reveal></div>
    <h2 class="title" data-t="dayTitle" data-reveal></h2>
    <p id="day-sub" class="smallcaps" data-reveal></p>
    <ul id="datestrip" class="datestrip" data-reveal></ul>
    <ol id="timeline" class="timeline"></ol>
  </section>

  <!-- footer -->
  <footer class="foot">
    <div class="tiles" aria-hidden="true"></div>
    <div class="birds-home" aria-hidden="true" data-reveal></div>
    <p class="foot-line" data-t="footer" data-reveal></p>
    <p class="signature" data-reveal>Isaac &amp; Dodo</p>
    <p class="hashtag" data-reveal>#IDoDodo</p>
  </footer>
</main>

</body>
</html>
