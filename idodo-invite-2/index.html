<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<title>Isaac &amp; Dodo · Wedding</title>
<meta name="theme-color" content="#EBDADD">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;1,400&family=Cormorant+Garamond:ital,wght@0,400;0,500;1,400&family=Noto+Serif+TC:wght@400;500;600&display=swap">
<link rel="stylesheet" href="style.css">
<!-- the same words, date and venue as the first card: edit ../idodo-invite/content.js and both change -->
<script src="../idodo-invite/content.js"></script>
<script src="app.js" defer></script>
</head>
<body class="sealed">

<!-- host only: personal link maker (?host) -->
<section id="host" class="host" hidden>
  <h2 data-t="hostTitle"></h2>
  <p class="host-lead" data-t="hostLead"></p>
  <textarea id="host-names" rows="5"></textarea>
  <div class="host-row">
    <button type="button" id="host-make" data-t="hostMake"></button>
    <button type="button" id="host-copy-all" class="ghost" data-t="hostCopyAll"></button>
  </div>
  <ul id="host-links"></ul>
  <p class="host-note" data-t="hostNote"></p>
</section>

<!-- language + music -->
<div class="lang" role="group" aria-label="Language">
  <button type="button" data-lang="zh" aria-pressed="true">中</button>
  <button type="button" data-lang="en" aria-pressed="false">EN</button>
</div>
<button type="button" id="music" class="music" hidden aria-pressed="false">
  <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 9v6h4l5 4V5L8 9H4z"/><path class="wave" d="M16 8.5a5 5 0 0 1 0 7M18.5 6a8.5 8.5 0 0 1 0 12"/></svg>
  <span class="sr" data-t="music"></span>
</button>
<audio id="audio" loop preload="none"></audio>

<!-- two sliding doors with the couple's plaque -->
<div id="doors" class="doors" role="button" tabindex="0">
  <div class="door door-left" aria-hidden="true"></div>
  <div class="door door-right" aria-hidden="true">
    <div id="plaque" class="plaque"><span class="mono">I<i>&amp;</i>D</span></div>
  </div>
  <p class="tap"><span data-t="tapToOpen"></span></p>
</div>

<main id="main" class="page" tabindex="-1">

  <!-- the stage: the curtain opens, then the names appear -->
  <section class="stage">
    <div class="stage-box">
      <div class="stage-art" aria-hidden="true"></div>
      <div class="curtain" aria-hidden="true"><i class="c-left"></i><i class="c-right"></i><i class="c-valance"></i></div>
      <video id="curtain-video" class="curtain-video" src="art/curtain-open.mp4" poster="art/stage-closed.webp" muted playsinline preload="auto" disablepictureinpicture aria-hidden="true"></video>
      <div class="stage-text">
        <p class="eyebrow" data-t="eyebrow"></p>
        <h1 class="names"><span>Isaac</span><span class="amp">&amp;</span><span>Dodo</span></h1>
        <p id="hero-date" class="hero-date"></p>
      </div>
    </div>
    <a class="scroll-hint" href="#welcome"><span class="sr" data-t="scroll"></span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M6 9l6 6 6-6"/></svg></a>
  </section>

  <!-- welcome -->
  <section id="welcome" class="welcome">
    <div class="wisteria-top" aria-hidden="true" data-reveal></div>
    <p id="greeting" class="greeting" data-reveal></p>
    <p class="invite-line" data-t="eyebrow" data-reveal></p>
    <div class="swans" aria-hidden="true" data-reveal></div>
  </section>

  <div class="garland" aria-hidden="true" data-reveal></div>

  <!-- countdown -->
  <section id="countdown" class="countdown">
    <h2 class="title" data-t="countdownTitle" data-reveal></h2>
    <p id="countdown-sub" class="subtitle" data-reveal></p>
    <div id="countdown-clock" class="clock" hidden data-reveal>
      <p class="medal"><span id="cd-days">0</span><small data-t="days"></small></p>
      <p class="medal"><span id="cd-hours">0</span><small data-t="hours"></small></p>
      <p class="medal"><span id="cd-minutes">0</span><small data-t="minutes"></small></p>
    </div>
    <p id="countdown-note" class="countdown-note" hidden data-reveal></p>
  </section>

  <div class="garland" aria-hidden="true" data-reveal></div>

  <!-- celebration -->
  <section class="celebration">
    <div class="frame" data-reveal>
      <i class="corner tl" aria-hidden="true"></i><i class="corner br" aria-hidden="true"></i>
      <h2 class="title" data-t="celebrationTitle"></h2>
      <p class="subtitle" data-t="celebrationSub"></p>
      <p id="cele-when" class="cele-when"></p>
      <p id="cele-venue" class="cele-venue"></p>
      <p id="cele-address" class="cele-address"></p>
      <a id="map-link" class="map-btn" target="_blank" rel="noopener" data-t="map" hidden></a>
    </div>
  </section>

  <!-- story -->
  <section class="story">
    <div class="arch" data-reveal>
      <div class="arch-frame"><h2 class="title" data-t="storyTitle"></h2></div>
      <div id="story-text" class="story-text"></div>
    </div>
  </section>

  <div class="garland" aria-hidden="true" data-reveal></div>

  <!-- the day -->
  <section class="day">
    <h2 class="title" data-t="dayTitle" data-reveal></h2>
    <p id="day-sub" class="subtitle" data-reveal></p>
    <ol id="timeline" class="timeline"></ol>
  </section>

  <!-- footer -->
  <footer class="foot">
    <div class="foot-art" aria-hidden="true" data-reveal></div>
    <p class="foot-names" data-reveal>Isaac <i>&amp;</i> Dodo</p>
    <p class="foot-line" data-t="footer" data-reveal></p>
    <p class="hashtag" data-reveal>#IDoDodo</p>
  </footer>
</main>

</body>
</html>
